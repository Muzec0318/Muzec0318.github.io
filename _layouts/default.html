<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ site.title }}</title>

  <!-- Hacker Theme CSS -->
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <style>
    body {
      margin: 0;
      padding: 0;
    }

    .header-center {
      text-align: center;
      padding-top: 60px;
      padding-bottom: 40px;
    }

    .header-center h1 {
      font-size: 4rem;
      color: #b5e853;
      margin-bottom: 10px;
      text-shadow: 0 0 10px #b5e853;
    }

    .header-center h2 {
      color: #888;
      font-size: 1.5rem;
      font-weight: normal;
      margin-top: 0;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      margin: auto;
    }
  </style>
</head>

<body>

  <!-- Header -->
  <header>
    <div class="container header-center">
      <h1>{{ site.title }}</h1>
      <h2>{{ site.description }}</h2>
    </div>
  </header>

  <!-- Main Content -->
  <main class="container">
    {{ content }}
  </main>

</body>
</html>
